<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cảnh báo bảo mật</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Courier New', monospace;
  }

  #start-screen {
    position:fixed; inset:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    z-index:10000;
  }
  #start-btn {
    padding: 20px 40px;
    font-size: 1.5rem;
    background:#111;
    color:#fff;
    border:2px solid #444;
    border-radius:8px;
    cursor:pointer;
  }

  #hack-screen {
    display:none;
    position:fixed; inset:0;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    z-index:9999;
    animation: flash 0.15s infinite;
  }

  @keyframes flash {
    0%   { background:#ff0000; }
    25%  { background:#000000; }
    50%  { background:#ff0000; }
    75%  { background:#1a0000; }
    100% { background:#ff0000; }
  }

  #hack-screen h1 {
    color:#fff;
    font-size:8vw;
    text-shadow: 0 0 20px red, 0 0 40px red;
    animation: shake 0.1s infinite;
    letter-spacing: 3px;
  }

  #hack-screen h2 {
    color:#ffdd00;
    font-size:3.5vw;
    margin-top:15px;
    text-shadow: 0 0 10px red;
  }

  #hack-screen p {
    color:#fff;
    font-size:2vw;
    margin-top:10px;
  }

  @keyframes shake {
    0% { transform: translate(2px, 1px) rotate(0deg); }
    25% { transform: translate(-2px, -1px) rotate(-1deg); }
    50% { transform: translate(1px, 2px) rotate(1deg); }
    75% { transform: translate(-1px, -2px) rotate(0deg); }
    100% { transform: translate(2px, -1px) rotate(1deg); }
  }

  #skull {
    font-size:14vw;
    animation: shake 0.1s infinite;
  }

  #countdown {
    margin-top:25px;
    font-size:2.5vw;
    color:#0f0;
  }

  #gotcha {
    display:none;
    position:fixed; inset:0;
    background:linear-gradient(135deg,#ff9a00,#ff3caa);
    align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:9999;
    color:#fff;
    font-family: Arial, sans-serif;
  }

  #gotcha h1 {
    font-size:9vw;
    margin-bottom:10px;
    text-shadow: 0 0 20px #000;
  }

  #gotcha p {
    font-size:2.2vw;
  }

  .hidden { display:none !important; }
</style>
</head>
<body>

<!-- Màn hình bắt đầu: cần 1 cú click để trình duyệt cho phép fullscreen + âm thanh -->
<div id="start-screen">
  <button id="start-btn">Nhấn để mở tài liệu</button>
</div>

<div id="hack-screen">
  <div id="skull">💀</div>
  <h1>BẠN ĐÃ BỊ HACK</h1>
  <h2>Liên hệ Trung CEO để mở khóa</h2>
  <p>Đang mã hóa dữ liệu... <span id="percent">0%</span></p>
</div>

<div id="gotcha">
  <h1>😎 ANH CEO ĐẸP ZAI</h1>
  <p>Troll thôi, hết hồn chưa? 😂</p>
</div>

<audio id="scary-audio" loop>
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>
<audio id="heartbeat-audio" loop>
  <source src="https://actions.google.com/sounds/v1/ambiences/heartbeat.ogg" type="audio/ogg">
</audio>
<audio id="win-audio">
  <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
</audio>

<script>
  const startScreen = document.getElementById('start-screen');
  const hackScreen = document.getElementById('hack-screen');
  const gotcha = document.getElementById('gotcha');
  const scaryAudio = document.getElementById('scary-audio');
  const heartbeatAudio = document.getElementById('heartbeat-audio');
  const winAudio = document.getElementById('win-audio');
  const percentEl = document.getElementById('percent');

  function goFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  // Cố gắng giữ fullscreen: nếu người dùng thoát ra (bấm Esc), tự động yêu cầu lại
  // Lưu ý: trình duyệt luôn cho phép Esc thoát fullscreen vì lý do an toàn, JS không thể chặn hoàn toàn.
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && hackScreen.style.display === 'flex') {
      goFullscreen();
    }
  });

  // Chặn chuột phải và vài phím tắt phổ biến để tăng cảm giác "bị khóa"
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (['F11','F5','F12'].includes(e.key) ||
        (e.ctrlKey && ['r','w','t','n'].includes(e.key.toLowerCase()))) {
      e.preventDefault();
    }
  });

  startScreen.addEventListener('click', () => {
    startScreen.classList.add('hidden');
    hackScreen.style.display = 'flex';
    goFullscreen();
    scaryAudio.play().catch(()=>{});
    heartbeatAudio.play().catch(()=>{});

    let percent = 0;
    const percentInterval = setInterval(() => {
      percent += Math.floor(Math.random() * 8) + 2;
      if (percent > 99) percent = 99;
      percentEl.textContent = percent + '%';
    }, 250);

    setTimeout(() => {
      clearInterval(percentInterval);
      hackScreen.style.display = 'none';
      gotcha.style.display = 'flex';
      scaryAudio.pause();
      scaryAudio.currentTime = 0;
      heartbeatAudio.pause();
      heartbeatAudio.currentTime = 0;
      winAudio.play().catch(()=>{});
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }, 15000);
  });
</script>

</body>
</html>
